<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Saga Elite</title>
  <script>
    tailwind = { config: { theme: { extend: {
      fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] },
      colors: { saga: '#f2ca50', surface: '#131313', 'surface-muted': '#1f1f1f', 'surface-soft': '#0e0e0e', accent: '#d4af37', on: '#e5e2e1' }
    } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/common.js"></script>
  <script src="js/demo-state.js"></script>
</head>
<body class="min-h-screen bg-surface text-on">
  <div class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
    <div class="mb-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Product preview</p>
        <h1 class="mt-3 text-4xl font-serif font-semibold text-white md:text-5xl">Product Details</h1>
      </div>
      <div class="flex flex-wrap gap-3">
        <a class="rounded-full border border-white/10 bg-white/5 px-5 py-3 text-sm text-on hover:border-saga" href="product-listing.html">Back to Shop</a>
        <a class="rounded-full border border-white/10 bg-white/5 px-5 py-3 text-sm text-on hover:border-saga" href="cart.html">View Cart</a>
      </div>
    </div>

    <main class="grid gap-8 lg:grid-cols-[0.9fr_0.6fr]">
      <div class="rounded-[32px] bg-[#0d0d0d] p-6 shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
        <div id="product-details" class="grid gap-6 lg:grid-cols-[1fr_0.95fr]"></div>
      </div>

      <aside class="space-y-6">
        <div class="rounded-[32px] bg-surface-muted p-6 shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
          <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Product highlight</p>
          <p class="mt-4 text-sm leading-7 text-slate-300">This demo page shows variant selection, quantity controls, and cart add behavior with local persistence.</p>
        </div>
        <div class="rounded-[32px] bg-[#0d0d0d] p-6 shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
          <p class="text-sm uppercase tracking-[0.35em] text-slate-400">WhatsApp support</p>
          <a href="https://wa.me/94771234567" target="_blank" rel="noreferrer" class="mt-4 inline-flex rounded-full bg-saga px-4 py-3 text-sm font-semibold uppercase text-black">Open chat</a>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="js/product-details.js"></script>
</body>
</html>
