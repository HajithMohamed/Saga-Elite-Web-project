<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success - Saga Elite Shop</title>
  <script>
    tailwind = { 
      config: { 
        theme: { 
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif'],
              headline: ["Noto Serif"],
              body: ["Manrope"],
              label: ["Manrope"]
            },
            colors: {
              saga: '#f2ca50', 
              surface: '#131313', 
              accent: '#d4af37', 
              on: '#e5e2e1',
              "surface-container-low": "#1c1b1b"
            }
          } 
        } 
      } 
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/common.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="min-h-screen bg-[#060606] text-white flex flex-col font-sans">
  
  <div id="root-header"></div>
  
  <div class="flex-1 flex flex-col items-center justify-center p-6 text-center mt-16 max-w-sm mx-auto">
    <div class="w-24 h-24 rounded-full bg-[#D4AF37]/10 flex items-center justify-center mb-8 border border-[#D4AF37]/20">
      <span class="material-symbols-outlined text-[48px] text-[#D4AF37]">task_alt</span>
    </div>
    
    <h1 class="text-3xl font-bold tracking-tight mb-4">Architecture Acquired</h1>
    <p class="text-gray-400 mb-8 text-sm leading-relaxed">
      Your order <span id="order-id-display" class="text-white font-bold tracking-widest hidden"></span> has been received. 
      Preparation of your garments will begin shortly.
    </p>

    <div class="w-full space-y-4">
        <a href="product-listing.html" class="w-full block bg-[#D4AF37] text-black py-4 rounded-lg font-bold uppercase tracking-widest text-sm transition-colors hover:bg-yellow-500">
            Continue Shopping
        </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ord = localStorage.getItem('saga_demo_last_order');
        if(ord) {
            const display = document.getElementById('order-id-display');
            display.textContent = ord;
            display.classList.remove('hidden');
        }
    });
  </script>
</body>
</html>
