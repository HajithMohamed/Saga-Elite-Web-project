<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Success | Saga Elite</title>
  <script>
    tailwind = { config: { theme: { extend: {
      fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] },
      colors: { saga: '#f2ca50', surface: '#131313', 'surface-muted': '#1f1f1f', 'surface-soft': '#0e0e0e', accent: '#d4af37', on: '#e5e2e1' }
    } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-surface text-on">
  <div class="mx-auto max-w-6xl px-4 py-8 lg:px-8">
    <div class="rounded-[32px] bg-[#0d0d0d] p-10 text-center shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
      <div class="mx-auto inline-flex h-24 w-24 items-center justify-center rounded-full bg-saga text-4xl">✓</div>
      <h1 class="mt-8 text-4xl font-serif font-semibold text-white">Order Confirmed</h1>
      <p class="mt-4 max-w-2xl mx-auto text-base leading-8 text-slate-300">Your order has been placed in the demo system. The confirmation page simulates the final customer success flow including order reference and next steps.</p>
      <div class="mt-10 rounded-[28px] bg-[#111111] p-8 text-left text-slate-300">
        <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Order reference</p>
        <p class="mt-3 text-2xl font-semibold text-white" id="order-id">ORD-000000</p>
        <div class="mt-6 grid gap-4 sm:grid-cols-2">
          <div class="rounded-3xl bg-[#0b0b0b] p-5">
            <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Status</p>
            <p class="mt-3 text-xl text-saga">Confirmed</p>
          </div>
          <div class="rounded-3xl bg-[#0b0b0b] p-5">
            <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Next step</p>
            <p class="mt-3 text-xl text-white">Processing & packaging</p>
          </div>
        </div>
      </div>
      <div class="mt-10 grid gap-6 sm:grid-cols-2">
        <a href="product-listing.html" class="rounded-full bg-saga px-6 py-4 text-sm font-semibold uppercase text-black transition hover:bg-[#ffe088]">Continue shopping</a>
        <a href="admin-dashboard.html" class="rounded-full border border-white/10 bg-white/5 px-6 py-4 text-sm uppercase text-on hover:border-saga">View admin demo</a>
      </div>
    </div>
  </div>
  <script type="module" src="js/order-success.js"></script>
</body>
</html>
