<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Saga Elite</title>
  <script>
    tailwind = { config: { theme: { extend: {
      fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] },
      colors: { saga: '#f2ca50', surface: '#131313', 'surface-muted': '#1f1f1f', 'surface-soft': '#0e0e0e', accent: '#d4af37', on: '#e5e2e1' }
    } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-surface text-on">
  <div class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
    <header class="mb-10 flex flex-col gap-4 border-b border-white/10 pb-6 md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Shopping cart</p>
        <h1 class="mt-3 text-4xl font-serif font-semibold text-white md:text-5xl">Your demo bag</h1>
      </div>
      <a class="rounded-full border border-white/10 bg-white/5 px-5 py-3 text-sm text-on hover:border-saga" href="product-listing.html">Continue shopping</a>
    </header>

    <div class="grid gap-8 lg:grid-cols-[1fr_0.45fr]">
      <main>
        <div id="cart-items" class="space-y-6"></div>
      </main>
      <aside class="space-y-6">
        <div class="rounded-[32px] bg-surface-muted p-6 shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
          <h2 class="text-xl font-semibold text-white">Order summary</h2>
          <div class="mt-6 flex items-center justify-between text-sm text-slate-300">
            <span>Subtotal</span><span id="subtotal">LKR 0.00</span>
          </div>
          <div class="mt-6">
            <a id="checkout-button" class="inline-flex w-full items-center justify-center rounded-full bg-saga px-5 py-4 text-sm font-semibold uppercase text-black transition hover:bg-[#ffe088]" href="checkout.html">Checkout</a>
          </div>
        </div>
        <div class="rounded-[32px] bg-[#0d0d0d] p-6 shadow-[0_18px_60px_rgba(0,0,0,0.35)]">
          <p class="text-sm uppercase tracking-[0.35em] text-slate-400">Demo notice</p>
          <p class="mt-4 text-sm leading-7 text-slate-300">Cart data is stored locally. Use add/remove controls to update quantities and simulate the checkout path.</p>
        </div>
      </aside>
    </div>
  </div>
  <script type="module" src="js/cart.js"></script>
</body>
</html>
