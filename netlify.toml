# Netlify configuration — Saga Elite frontend (Client-Side, Vite SPA).
#
# The build runs from the monorepo ROOT (not Client-Side) so npm workspaces
# resolve against the root package-lock.json. The root "build" script proxies
# into Client-Side (`npm --prefix Client-Side run build`).

[build]
  command = "npm run build"
  publish = "Client-Side/dist"

[build.environment]
  # Must satisfy Vite 7's engine requirement (Node ^20.19 || >=22.12).
  NODE_VERSION = "20.19.0"

# ---------------------------------------------------------------------------
# Frontend runtime config is injected at BUILD time from Netlify environment
# variables (Site settings → Environment variables) — do NOT hardcode the real
# URLs here. Required:
#   VITE_API_URL        = https://<your-service>.up.railway.app/api
# Recommended / optional:
#   VITE_SOCKET_URL     = https://<your-service>.up.railway.app
#   VITE_APP_NAME       = Saga Elite
#   VITE_GOOGLE_CLIENT_ID  = <google oauth client id>   (blank hides the button)
#   VITE_FACEBOOK_APP_ID   = <facebook app id>          (blank hides the button)
# ---------------------------------------------------------------------------

# SPA fallback: every unknown path is served by index.html so React Router can
# handle it. API/socket traffic goes directly to the Railway backend via the
# absolute VITE_API_URL, so no proxy/redirect for /api is needed here.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
