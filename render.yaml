# Render Blueprint — Saga Elite backend (Express API + Socket.IO).
#
# The database is MongoDB Atlas (external) and is NOT provisioned here.
# Import this file via Render → New → Blueprint, then fill in every value
# marked `sync: false` in the dashboard. `sync: false` means the value is
# entered/stored in Render, never committed to git.
#
# The full list of supported variables (incl. payments, WhatsApp, bank inbox,
# OpenAI) lives in Server-side/.env.example — add any you need as extra
# Environment variables on the service.

services:
  - type: web
    name: saga-elite-api
    runtime: node
    plan: free
    rootDir: .
    # `npm install` at the repo root resolves the npm workspaces from the root
    # lockfile. `npm start` runs `node Server-side/server.js`.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production

      # ----- Required -----
      - key: MONGO_DB_URI            # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET              # random string, 32+ characters
        sync: false
      - key: FRONTEND_URL            # Netlify site URL, e.g. https://saga-elite.netlify.app
        sync: false
      - key: CLIENT_URL             # usually identical to FRONTEND_URL (socket CORS)
        sync: false

      # ----- Auth / cookies -----
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_COOKIE_EXPIRES_IN
        value: "7"

      # ----- Cloudinary (image uploads) -----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ----- Email (SMTP) -----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Saga Elite
