services:
  backend:
    build:
      context: .
      dockerfile: Server-side/Dockerfile.prod
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: saga_backend_prod
    restart: always
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}
      - PAYHERE_SANDBOX=false
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - BANK_NAME=${BANK_NAME}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME}
      - BANK_ACCOUNT_NUMBER=${BANK_ACCOUNT_NUMBER}
      - BANK_BRANCH=${BANK_BRANCH}
      - MOBILE_BANKING_1_NAME=${MOBILE_BANKING_1_NAME}
      - MOBILE_BANKING_1_NUMBER=${MOBILE_BANKING_1_NUMBER}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - saga_network

  frontend:
    build:
      context: .
      dockerfile: Client-Side/Dockerfile.prod
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # Default to relative /api/v1 — nginx proxies to backend, so no public backend URL leaks into the bundle.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: saga_frontend_prod
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saga_network

  nginx:
    image: nginx:1.25-alpine
    container_name: saga_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Client-Side/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - saga_network

networks:
  saga_network:
    driver: bridge
