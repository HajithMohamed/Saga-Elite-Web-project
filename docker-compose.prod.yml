services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: saga_backend_prod
    restart: always
    expose:
      - "5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
    volumes:
      - ./Server-side:/app
      - /app/node_modules
    networks:
      - saga_network
    healthcheck:
      test: ["CMD", "wget", "-qO", "http://localhost:5001/api/v1/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./Client-Side
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-https://your-domain.com/api/v1}
    container_name: saga_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Client-Side/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saga_network

networks:
  saga_network:
    driver: bridge