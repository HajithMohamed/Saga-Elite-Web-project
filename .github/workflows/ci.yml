name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      
      # Client-Side Build
      - name: Check if Client-Side exists
        id: check-client
        run: |
          if [ -d "Client-Side" ] && [ -f "Client-Side/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Client-Side folder not found - skipping client build"
          fi
      
      - name: Install Client-Side Dependencies
        if: steps.check-client.outputs.exists == 'true'
        working-directory: ./Client-Side
        run: npm ci || npm install
      
      - name: Build Client-Side
        if: steps.check-client.outputs.exists == 'true'
        working-directory: ./Client-Side
        run: npm run build --if-present
      
      - name: Test Client-Side
        if: steps.check-client.outputs.exists == 'true'
        working-directory: ./Client-Side
        run: npm test --if-present || echo "No tests configured"
      
      # Server-side Build
      - name: Check if Server-side exists
        id: check-server
        run: |
          if [ -d "Server-side" ] && [ -f "Server-side/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server-side folder not found - skipping server build"
          fi
      
      - name: Install Server-side Dependencies
        if: steps.check-server.outputs.exists == 'true'
        working-directory: ./Server-side
        run: npm ci || npm install
      
      - name: Lint Server-side Code
        if: steps.check-server.outputs.exists == 'true'
        working-directory: ./Server-side
        run: npm run lint --if-present || echo "No lint configured"
      
      - name: Test Server-side
        if: steps.check-server.outputs.exists == 'true'
        working-directory: ./Server-side
        run: npm test --if-present || echo "No tests configured"
      
      # Security Audit
      - name: Run Security Audit (Client)
        if: steps.check-client.outputs.exists == 'true'
        working-directory: ./Client-Side
        run: npm audit --audit-level=moderate || true
      
      - name: Run Security Audit (Server)
        if: steps.check-server.outputs.exists == 'true'
        working-directory: ./Server-side
        run: npm audit --audit-level=moderate || true
      
      # Summary
      - name: CI Success
        run: |
          echo "✅ CI Pipeline completed!"
          echo "📦 Client-Side: ${{ steps.check-client.outputs.exists == 'true' && 'Built' || 'Skipped (not found)' }}"
          echo "🔧 Server-side: ${{ steps.check-server.outputs.exists == 'true' && 'Built' || 'Skipped (not found)' }}"

  e2e-tests:
    name: Playwright E2E
    needs: build-and-test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      - name: Install root dependencies (including Playwright)
        run: npm ci --include=dev || npm install --include=dev

      - name: Verify Playwright CLI
        run: npm exec --yes --package=@playwright/test -- playwright --version

      - name: Install Server-side dependencies
        working-directory: ./Server-side
        run: npm ci || npm install

      - name: Install Client-Side dependencies
        working-directory: ./Client-Side
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npm exec --yes --package=@playwright/test -- playwright install --with-deps chromium

      - name: Prepare e2e env file
        run: cp e2e/.env.test.example e2e/.env.test

      - name: Verify Playwright before test run
        run: npm run test:e2e -- --version

      - name: Run Playwright suite
        env:
          CI: "1"
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/saga_elite_test
          NODE_ENV: test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload trace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
