services:
  backend:
    build:
      context: ./Server-side
      dockerfile: Dockerfile
    container_name: saga_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./Server-side:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - saga_network

  frontend:
    build:
      context: ./Client-Side
      dockerfile: Dockerfile
    container_name: saga_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api/v1
      - VITE_BACKEND_TARGET=http://backend:5001
    volumes:
      - ./Client-Side:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saga_network

networks:
  saga_network:
    driver: bridge
