services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saga_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./Server-side:/workspace/Server-side
      - /workspace/Server-side/node_modules
    networks:
      - saga_network

  frontend:
    build:
      context: ./Client-Side
      dockerfile: Dockerfile
    container_name: saga_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api/v1
    volumes:
      - ./Client-Side:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - saga_network

networks:
  saga_network:
    driver: bridge
