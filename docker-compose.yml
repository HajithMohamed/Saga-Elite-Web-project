services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saga_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5001
    volumes:
      - ./Server-side:/app
      - /app/node_modules
    networks:
      - saga_network
    healthcheck:
      test: ["CMD", "wget", "-qO", "http://localhost:5001/api/v1/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./Client-Side
      dockerfile: Dockerfile
    container_name: saga_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5001/api/v1
      - VITE_SOCKET_URL=http://backend:5001
    volumes:
      - ./Client-Side:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saga_network

networks:
  saga_network:
    driver: bridge