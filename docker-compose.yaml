version: '3.8'

services:
  backend:
    # Backend URL: http://localhost:${BACKEND_PORT}
    build:
      context: ./Server-side
      dockerfile: Dockerfile
    container_name: sagaelite-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      # only the workspace-root .env is required; backend-specific overrides
      # can be added later if needed
      - ./.env
    volumes:
      - ./Server-side:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    # Frontend URL: http://localhost:5174
    build:
      context: ./Client-Side/Saga-Elite-Front-End
      dockerfile: Dockerfile
    container_name: sagaelite-frontend
    ports:
      - "5174:80"
    environment:
      # pass any VITE_ variables from root .env (or override here)
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./Client-Side/Saga-Elite-Front-End:/app
      - /app/node_modules
