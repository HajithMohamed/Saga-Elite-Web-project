services:
  backend:
    build:
      context: ./Server-side
      dockerfile: Dockerfile
    container_name: sagaelite-backend
    ports:
      - "${BACKEND_PORT:-5001}:${BACKEND_PORT:-5001}"
    env_file:
      - path: ./.env
        required: false
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-5001}
      PORT: ${BACKEND_PORT:-5001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5174}}
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./Server-side:/app
      - backend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - sh
      - -c
      - npm run dev -- --legacy-watch

  frontend:
    build:
      context: ./Client-Side
      dockerfile: Dockerfile
    container_name: sagaelite-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-5001}/api}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./Client-Side:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  backend_node_modules:
  frontend_node_modules:
