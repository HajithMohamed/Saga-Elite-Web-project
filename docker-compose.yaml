services:
  backend:
    # Backend URL: http://localhost:${BACKEND_PORT:-5001}
    build:
      context: ./Server-side
      dockerfile: Dockerfile
    container_name: sagaelite-backend
    # provide a sensible default so the service still publishes a port even if
    # the user forgot to create a .env file.  Compose variable substitution
    # supports the "${VAR:-default}" syntax.
    ports:
      - "${BACKEND_PORT:-5001}:${BACKEND_PORT:-5001}"
    env_file:
      # only the workspace-root .env is required; backend-specific overrides
      # can be added later if needed
      - ./.env
    volumes:
      # mount source code for live editing.
      - ./Server-side:/app
      # keep container-installed dependencies available even with the bind mount
      - /app/node_modules
    command: npm run dev

  frontend:
    # Frontend URL: http://localhost:5174 (maps to 5173 inside container)
    build:
      context: ./Client-Side
      dockerfile: Dockerfile
    container_name: sagaelite-frontend
    ports:
      - "5174:5173"
    environment:
      # pass any VITE_ variables from root .env (or override here)
      - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./Client-Side:/app
      - /app/node_modules
