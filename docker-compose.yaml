services:
  backend:
    build: ./Server-side
    container_name: backend
    restart: always
    env_file:
      - ./Server-side/.env
    ports:
      - "5000:5000"

  frontend:
    build: ./Client-Side/Saga-Elite-Front-End
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend